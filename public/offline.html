<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4f46e5" />
    <title>Offline · ActionBrain</title>
    <!--
      Shown by the service worker (public/sw.js) when a page cannot be loaded because the device is offline.
      It is deliberately plain HTML with no JavaScript. If this were a normal Next.js page, the app would try to
      start up under whatever address the user was visiting and crash. Styles mirror the app's design tokens.
    -->
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 24px;
        text-align: center;
        background: #f8fafc;
        color: #0f172a;
        font: 14px/20px ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
      }
      .badge {
        display: flex; align-items: center; justify-content: center;
        width: 48px; height: 48px; border-radius: 12px; background: #eef2ff; color: #4f46e5; font-size: 24px;
      }
      h1 { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 4px 0 0; color: #64748b; max-width: 360px; }
      a {
        display: inline-flex; align-items: center; height: 36px; padding: 0 16px; border-radius: 8px;
        background: #4f46e5; color: #fff; font-weight: 500; text-decoration: none;
      }
      a:hover { background: #4338ca; }
    </style>
  </head>
  <body>
    <div class="badge" aria-hidden="true">&#9889;</div>
    <div>
      <h1>You are offline</h1>
      <p>ActionBrain needs an internet connection. Your data is safe and will be here when you reconnect.</p>
    </div>
    <a href="/dashboard">Try again</a>
  </body>
</html>
